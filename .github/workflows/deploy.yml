name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Frontend Config File
        run: |
          echo "window.ENV = {" > config.js
          echo "  CODIV_API_KEY: '${{ secrets.CODIV_API_KEY }}'," >> config.js
          echo "  ALLOW_SHARED_MARKING: ${{ secrets.ALLOW_SHARED_MARKING }}," >> config.js
          echo "  ALLOWED_ORIGIN: '${{ secrets.ALLOWED_ORIGIN }}'" >> config.js
          echo "};" >> config.js

      - name: Upload production assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
